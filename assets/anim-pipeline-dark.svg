<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" role="img" aria-labelledby="pt">
  <title id="pt">Animated ship pipeline with a pulse traveling across stages</title>
  <defs>
    <linearGradient id="trailD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="fglowD" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="840" height="160" fill="#0d1117" rx="12"/>
  <text x="420" y="26" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="0.14em">PIPELINE PULSE</text>
  <!-- Stage cards -->
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="48" y="44" width="120" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="108" y="74" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Build</text>
    <text x="108" y="92" text-anchor="middle" fill="#6e7681" font-size="11">compile</text>

    <rect x="248" y="44" width="120" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="308" y="74" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Test</text>
    <text x="308" y="92" text-anchor="middle" fill="#6e7681" font-size="11">verify</text>

    <rect x="448" y="44" width="120" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="508" y="74" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Ship</text>
    <text x="508" y="92" text-anchor="middle" fill="#6e7681" font-size="11">release</text>

    <rect x="648" y="44" width="120" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="708" y="74" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Observe</text>
    <text x="708" y="92" text-anchor="middle" fill="#6e7681" font-size="11">metrics</text>
  </g>
  <!-- Travel path (centered under cards ~ y=118) -->
  <path id="motionPathD" fill="none" stroke="none" d="M 108 122 C 190 108 230 136 308 122 C 396 108 432 136 508 122 C 586 108 632 136 708 122"/>
  <path fill="none" stroke="url(#trailD)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.45" d="M 108 122 C 190 108 230 136 308 122 C 396 108 432 136 508 122 C 586 108 632 136 708 122"/>
  <circle r="8" fill="#58a6ff" filter="url(#fglowD)">
    <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
      <mpath href="#motionPathD"/>
    </animateMotion>
    <animate attributeName="fill" values="#58a6ff;#a371f7;#7ee787;#f778ba;#58a6ff" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
